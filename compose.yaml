services:
  gtech:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_PATH: /app/storage/gtech.sqlite
      UPLOAD_DIR: /app/storage/uploads
      ENABLE_DEV_CHECKOUT: "false"
    volumes:
      - gtech-storage:/app/storage
      - gtech-backups:/app/backups

volumes:
  gtech-storage:
  gtech-backups:
